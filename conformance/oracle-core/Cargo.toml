[package]
name = "oracle-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Conformance harness backed by Bitcoin Core v32.1's own consensus code, compiled from source"
publish = false
build = "build.rs"

# Standalone crate: excluded from the repository workspace (see the root Cargo.toml) because it
# needs a Bitcoin Core source tree (BITCOIN_CORE_SRC) and a C++20 compiler to build.

[[bin]]
name = "oracle-core-harness"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
