# Functional test framework configuration for the official v32.1 release
# binaries unpacked at /opt/bitcoin-32.1 inside the recorder image. This
# replaces the config.ini that a Bitcoin Core build tree would generate from
# test/config.ini.in.

[environment]
CLIENT_NAME=Bitcoin Core
CLIENT_BUGREPORT=https://github.com/bitcoin/bitcoin/issues
SRCDIR=/core
BUILDDIR=/opt/bitcoin-32.1
EXEEXT=
RPCAUTH=/opt/bitcoin-32.1/share/rpcauth/rpcauth.py

[components]
ENABLE_WALLET=true
BUILD_BENCH=false
ENABLE_CLI=true
BUILD_BITCOIN_TX=true
ENABLE_BITCOIN_UTIL=true
ENABLE_BITCOIN_CHAINSTATE=false
ENABLE_WALLET_TOOL=true
ENABLE_BITCOIND=true
ENABLE_FUZZ_BINARY=false
ENABLE_ZMQ=false
ENABLE_EMBEDDED_ASMAP=false
ENABLE_EXTERNAL_SIGNER=false
ENABLE_USDT_TRACEPOINTS=false
ENABLE_IPC=false
BUILD_GUI=false
