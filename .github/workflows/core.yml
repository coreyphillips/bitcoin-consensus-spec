name: core

# Rechecks the two artifacts every expectation comes from against Bitcoin Core
# v32.1 itself: the derived vectors are regenerated by the oracle built from
# Core's source, and the block corpus is replayed through bitcoind. The same
# bitcoind then gets random multi-branch scenarios, which the reference must
# answer with the same chain state. Weekly, by hand, and on pull requests that
# change them or the code that produces them.
# A separate workflow from extended.yml, so that such a pull request does not
# also start the mutation audit and peer-sync.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "conformance/oracle-core/**"
      - "conformance/recorder/**"
      - "conformance/runner/**"
      - "conformance/tools/**"
      - "conformance/vectors/**"
      - ".github/compare-derived.sh"
      - ".github/fetch-bitcoind.sh"
      - ".github/workflows/core.yml"

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  derived:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # build.rs refuses a checkout that is not at the pinned commit, so a
      # moved tag fails the build.
      - name: Bitcoin Core v32.1 source
        run: git clone --quiet --depth 1 --branch v32.1 https://github.com/bitcoin/bitcoin.git "$RUNNER_TEMP/bitcoin-core"
      - name: Build the oracle from Core's source
        run: BITCOIN_CORE_SRC="$RUNNER_TEMP/bitcoin-core" cargo build --release --manifest-path conformance/oracle-core/Cargo.toml
      - name: Build the runner
        run: cargo build --release -p conformance-runner
      - name: Regenerate the derived vectors
        run: ./target/release/bcs-conformance derive --oracle conformance/oracle-core/target/release/oracle-core-harness --out "$RUNNER_TEMP/derived"
      - name: The committed derived vectors are the regenerated ones
        run: sh .github/compare-derived.sh conformance/vectors/derived "$RUNNER_TEMP/derived"
      - name: The committed pow vectors are the oracle's answers
        run: ./target/release/bcs-conformance --impl conformance/oracle-core/target/release/oracle-core-harness --suite pow --fail-on-level2
      - name: The committed signet vectors are the oracle's answers
        run: ./target/release/bcs-conformance --impl conformance/oracle-core/target/release/oracle-core-harness --suite signet --fail-on-level2
      - name: The committed params vectors are the oracle's answers
        run: ./target/release/bcs-conformance --impl conformance/oracle-core/target/release/oracle-core-harness --suite params --fail-on-level2
      - name: Build the reference harness
        run: cargo build --release -p bitcoin-consensus-spec --bin reference-harness
      # A new seed each run, printed first, so a failure can be repeated with --seed.
      - name: Random requests, the reference against the oracle
        run: |
          python3 conformance/tools/differential.py --cases 20000 --seed "$GITHUB_RUN_ID" \
            --a target/release/reference-harness --b conformance/oracle-core/target/release/oracle-core-harness

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Bitcoin Core v32.1 from bitcoincore.org, checked against pins.json
        run: |
          bitcoind=$(sh .github/fetch-bitcoind.sh "$RUNNER_TEMP/core")
          "$bitcoind" -version | sed -n 1p
          echo "BCS_BITCOIND=$bitcoind" >> "$GITHUB_ENV"
      - name: Build the runner
        run: cargo build --release -p conformance-runner
      - name: Corpus, replayed through bitcoind by the Core chain harness
        run: |
          ./target/release/bcs-conformance corpus --fail-on-level2 --fail-on-tips \
            --impl "python3 $PWD/conformance/recorder/core_chain_harness.py"
      - name: Build the reference harness
        run: cargo build --release -p bitcoin-consensus-spec --bin reference-harness
      # A new seed each run, printed first, so a failure can be repeated with --seed and --only.
      - name: Random multi-branch scenarios, the reference against bitcoind
        run: |
          python3 conformance/tools/multibranch.py --scenarios 100 --seed "$GITHUB_RUN_ID" \
            --a target/release/reference-harness --b "python3 $PWD/conformance/recorder/core_chain_harness.py"
