name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  spec-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The check compares spec/ with the newest version tag, which a shallow checkout lacks.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Specification version consistent, and bumped after spec/ changes
        run: python3 .github/check_spec_version.py

  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust, the release rust-toolchain.toml names
        run: rustup toolchain install --no-self-update
      - name: Known-answer tests from the specification and the runner's unit tests
        run: cargo test --release --workspace
      - name: Build the reference and the runner
        run: cargo build --release
      # The README promises identical error identifiers, UTXO set hashes and
      # chain tip sets, which fail the run only with these two flags.
      - name: Conformance suite against the reference
        run: ./target/release/bcs-conformance --impl ./target/release/reference-harness --fail-on-level2 --fail-on-tips
      # Fails when a mutant names no Appendix A item or a number Appendix A
      # does not have; the full audit runs in extended.yml.
      - name: Appendix A items without a mutant
        run: python3 conformance/mutation/run.py --items
      - name: Core chain harness request loop, with bitcoind stubbed
        run: python3 -m unittest discover -s conformance/recorder
      - name: No em or en dash characters
        run: |
          if grep -rnI --exclude-dir=target --exclude-dir=.git -e "$(printf '\xe2\x80\x94')" -e "$(printf '\xe2\x80\x93')" . ; then
            echo "Found an em or en dash character"
            exit 1
          fi

  # The runner starts and stops commands through process.rs, which depends on
  # platform behavior, so the same tests and suites run on macOS too.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust, the release rust-toolchain.toml names
        run: rustup toolchain install --no-self-update
      - name: Known-answer tests from the specification and the runner's unit tests
        run: cargo test --release --workspace
      - name: Build the reference and the runner
        run: cargo build --release
      - name: Conformance suite against the reference
        run: ./target/release/bcs-conformance --impl ./target/release/reference-harness --fail-on-level2 --fail-on-tips
