name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Known-answer tests from the specification and the runner's unit tests
        run: cargo test --release --workspace
      - name: Build the reference and the runner
        run: cargo build --release
      - name: Conformance suite against the reference
        run: ./target/release/bcs-conformance --impl ./target/release/reference-harness
      - name: No em or en dash characters
        run: |
          if grep -rnI --exclude-dir=target --exclude-dir=.git -e "$(printf '\xe2\x80\x94')" -e "$(printf '\xe2\x80\x93')" . ; then
            echo "Found an em or en dash character"
            exit 1
          fi

  # The runner starts and stops commands through process.rs, which depends on
  # platform behavior, so the same tests and suites run on macOS too.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Known-answer tests from the specification and the runner's unit tests
        run: cargo test --release --workspace
      - name: Build the reference and the runner
        run: cargo build --release
      - name: Conformance suite against the reference
        run: ./target/release/bcs-conformance --impl ./target/release/reference-harness
