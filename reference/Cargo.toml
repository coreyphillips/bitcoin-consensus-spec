[package]
name = "bitcoin-consensus-spec"
version = "0.1.0"
# Not inherited from the workspace, so that a copy of reference/ and spec/ builds on its own, without
# the crates.io index the runner's dependencies need (README, Quick start).
edition = "2021"
license = "MIT"
repository = "https://github.com/coreyphillips/bitcoin-consensus-spec"
description = "Executable reference generated from the bitcoin-consensus-spec documents (spec/*.md)"
build = "build.rs"

[lib]
name = "bcs"
path = "src/lib.rs"

[[bin]]
name = "reference-harness"
path = "src/bin/harness.rs"

# The reference has no dependencies: everything is defined in spec/*.md using the Rust standard library.
[dependencies]

[[bin]]
name = "reference-node"
path = "src/bin/node.rs"
