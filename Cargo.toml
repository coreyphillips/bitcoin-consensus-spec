[workspace]
resolver = "2"
members = ["reference", "conformance/runner"]
exclude = ["conformance/oracle-core"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/coreyphillips/bitcoin-consensus-spec"

[profile.release]
debug = 1
overflow-checks = true

[profile.dev]
opt-level = 2
overflow-checks = true
